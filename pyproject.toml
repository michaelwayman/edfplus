[project]
name = "edfplus"
version = "0.0.1"
description = "A python library for reading EDF/EDF+ files and generating timestamps"
readme = "README.md"
authors = [
    { name = "Michael Wayman", email = "michaelwayman@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.1",
]

[project.urls]
Repository = "https://github.com/michaelwayman/edfplus.git"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.0",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
    "ty>=0.0.61",
]
docs = [
    "mkdocs-material>=9.6",
    "mkdocstrings[python]>=0.29",
]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py314"
exclude = []

[tool.ruff.lint]
extend-select = ["I"]

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "-s"
